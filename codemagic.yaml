# containerpreis24 — iOS TestFlight Build Pipeline

workflows:
  ios-testflight-build:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app-store-connect-credentials
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "de.containerpreis24.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: "6771851906"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Pull live web shell from VPS
        script: npm run build:web

      - name: Stash iOS overrides + regenerate platform
        script: |
          set -e
          OVERRIDE_DIR=/tmp/ios-overrides
          rm -rf "$OVERRIDE_DIR" && mkdir -p "$OVERRIDE_DIR"
          [ -f ios/App/App/Info.plist.template ] && cp ios/App/App/Info.plist.template "$OVERRIDE_DIR/" || true
          [ -f ios/App/App/PrivacyInfo.xcprivacy ] && cp ios/App/App/PrivacyInfo.xcprivacy "$OVERRIDE_DIR/" || true
          [ -f ios/App/App/App.entitlements ] && cp ios/App/App/App.entitlements "$OVERRIDE_DIR/" || true
          [ -d ios/App/App/Assets.xcassets ] && cp -r ios/App/App/Assets.xcassets "$OVERRIDE_DIR/" || true
          rm -rf ios
          npx cap add ios
          # Apple-conforming Bundle-ID hat keine Dashes-Issue (de.containerpreis24.app passt Java-Form bereits)
          npx cap sync ios

      - name: Apply iOS overrides (Info.plist + Entitlements + Privacy Manifest + Assets)
        script: |
          set -e
          OVERRIDE_DIR=/tmp/ios-overrides
          if [ -f "$OVERRIDE_DIR/Info.plist.template" ]; then
            cp "$OVERRIDE_DIR/Info.plist.template" ios/App/App/Info.plist
          fi
          [ -f "$OVERRIDE_DIR/PrivacyInfo.xcprivacy" ] && cp "$OVERRIDE_DIR/PrivacyInfo.xcprivacy" ios/App/App/
          [ -f "$OVERRIDE_DIR/App.entitlements" ] && cp "$OVERRIDE_DIR/App.entitlements" ios/App/App/
          [ -d "$OVERRIDE_DIR/Assets.xcassets" ] && rm -rf ios/App/App/Assets.xcassets && cp -r "$OVERRIDE_DIR/Assets.xcassets" ios/App/App/
          ls -la ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements ios/App/App/Info.plist

      - name: iPad-Simulator Launch-Screenshot (Verify Apple 2.1a kein Black-Screen)
        ignore_failure: true
        script: |
          set +e
          OUT="$CM_BUILD_DIR/artifacts"; mkdir -p "$OUT"
          LOG="$OUT/sim-step.log"
          {
            echo "== Runtimes =="; xcrun simctl list runtimes | grep -i ios
            echo "== iPad-Geraete =="; xcrun simctl list devices available | grep -i ipad
            UDID=$(xcrun simctl list devices available | grep -i ipad | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
            if [ -z "$UDID" ]; then
              RT=$(xcrun simctl list runtimes | grep -i ios | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ ]*' | tail -1)
              DT=$(xcrun simctl list devicetypes | grep -i ipad | grep -oE 'com.apple.CoreSimulator.SimDeviceType.[^ )]*' | head -1)
              echo "Erstelle iPad: RT=$RT DT=$DT"
              UDID=$(xcrun simctl create cp24-ipad "$DT" "$RT")
            fi
            echo "UDID=$UDID"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            echo "== xcodebuild Simulator (unsigniert) =="
            xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" \
              -configuration Debug -destination "id=$UDID" -derivedDataPath build-sim \
              CODE_SIGNING_ALLOWED=NO build
            APP=$(find build-sim -name App.app -type d | head -1)
            echo "APP=$APP"
            echo "== bundled capacitor.config.json =="
            cat "$APP/capacitor.config.json" 2>/dev/null
            echo "== bundled public/index.html (head) =="
            head -25 "$APP/public/index.html" 2>/dev/null
            echo "== public/ inhalt =="; ls -la "$APP/public" 2>/dev/null | head
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 12
            xcrun simctl io "$UDID" screenshot "$OUT/ipad-launch.png"
            echo "== App-Log (Capacitor Loading/Errors) =="
            xcrun simctl spawn "$UDID" log show --style compact --last 25s 2>/dev/null | grep -iE 'capacitor|containerpreis|loading app|wkweb|webview|did fail|error|crash|fatal' | head -50
            echo "== OUT =="; ls -la "$OUT"
          } > "$LOG" 2>&1
          echo "---- sim-step.log (tail) ----"; tail -40 "$LOG"
          exit 0

      - name: Initialize keychain & fetch signing files (auto via ASC API)
        script: |
          set -e
          keychain initialize
          printf '%s' "$IOS_DIST_CERT_KEY" > /tmp/cert_key.pem  # Gemeinsamer Signing-Key (Fix 2026-06-06: Cert-Limit 409)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          # Use a timestamp-based build number — guarantees uniqueness across rebuilds
          # Format: YYMMDDHHMM (z.B. 2605212010 für 21.05.2026 20:10)
          NEXT_BUILD=$(date -u +"%y%m%d%H%M")
          # Strip leading zero so agvtool doesn't complain about leading zeros
          NEXT_BUILD=$((10#$NEXT_BUILD))
          echo "Setting build number to $NEXT_BUILD (timestamp-based)"
          agvtool new-version -all $NEXT_BUILD

      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - artifacts/*
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM.zip

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
      email:
        recipients:
          - ambrazevicius.ignas@gmail.com
        notify:
          success: true
          failure: true
